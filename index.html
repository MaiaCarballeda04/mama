<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Feliz Cumpleaños, Mamá!</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    body {
      background-color: #fce4ec;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      color: #4a148c;
      text-align: center;
    }

    h1 { font-size: 2.5rem; margin-bottom: 10px; }
    p { font-size: 1.2rem; margin-top: 0; }

    /* Contenedor principal con altura fija */
    .stage {
      position: relative;
      width: 260px;
      height: 200px;
      margin: 30px auto 10px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    /* Plato */
    .plate {
      width: 240px;
      height: 15px;
      background: #e0e0e0;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      z-index: 1;
    }

    /* Capas de la torta */
    .layer {
      width: 200px;
      height: 0;
      background-color: #4e342e;
      border-radius: 8px 8px 0 0;
      transition: height 1s ease-in-out;
      position: relative;
      z-index: 2;
    }

    .layer-top {
      width: 180px;
      background-color: #3e2723;
      z-index: 3;
    }

    .frosting {
      width: 100%;
      height: 15px;
      background-color: #8d6e63;
      border-radius: 8px 8px 0 0;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    /* Velas en posición perfecta */
    .candles {
      display: flex;
      gap: 15px;
      position: absolute;
      bottom: 110px; /* Alineado exacto a la superficie final del pastel */
      z-index: 4;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .candle {
      width: 12px;
      height: 40px;
      background: repeating-linear-gradient(45deg, #ff4081, #ff4081 5px, #ffffff 5px, #ffffff 10px);
      border-radius: 3px;
      position: relative;
      cursor: pointer;
    }

    /* Llama integrada */
    .flame {
      width: 12px;
      height: 16px;
      background: #ffeb3b;
      border-radius: 50% 50% 20% 20%;
      position: absolute;
      top: -16px;
      left: 0;
      box-shadow: 0 0 10px #ff9800;
      animation: flicker 0.6s infinite alternate;
    }

    .flame.off { display: none; }

    @keyframes flicker {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    /* Botón */
    .btn {
      background-color: #ec407a;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s, background-color 0.2s;
      margin-top: 15px;
    }

    .btn:hover {
      background-color: #d81b60;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <h1>¡Feliz Cumpleaños, Mamá! ❤️</h1>
  <p id="instruction">Presiona el botón para preparar tu sorpresa</p>

  <div class="stage">
    <div class="candles" id="candlesGroup">
      <div class="candle" onclick="blowOut(this)"><div class="flame"></div></div>
      <div class="candle" onclick="blowOut(this)"><div class="flame"></div></div>
      <div class="candle" onclick="blowOut(this)"><div class="flame"></div></div>
    </div>
    <div class="layer layer-top" id="layer2"><div class="frosting" id="frosting"></div></div>
    <div class="layer" id="layer1"></div>
    <div class="plate"></div>
  </div>

  <button class="btn" id="actionBtn" onclick="startBaking()">Preparar Torta 🎂</button>

  <script>
    let step = 0;
    let litCandles = 3;

    function startBaking() {
      const btn = document.getElementById('actionBtn');
      const instruction = document.getElementById('instruction');

      if (step === 0) {
        document.getElementById('layer1').style.height = '50px';
        instruction.textContent = "Horneando la primera capa de chocolate...";
        btn.disabled = true;
        
        setTimeout(() => {
          document.getElementById('layer2').style.height = '45px';
          document.getElementById('frosting').style.opacity = '1';
          instruction.textContent = "Agregando la cobertura y decorando...";
        }, 1200);

        setTimeout(() => {
          document.getElementById('candlesGroup').style.opacity = '1';
          instruction.textContent = "¡Pedí un deseo y hacé clic en las velas para apagarlas!";
          btn.style.display = 'none';
          
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }, 2500);
      }
    }

    function blowOut(candleElement) {
      const flame = candleElement.querySelector('.flame');
      
      if (!flame.classList.contains('off')) {
        flame.classList.add('off');
        litCandles--;

        confetti({ particleCount: 30, spread: 50, origin: { y: 0.7 } });

        if (litCandles === 0) {
          document.getElementById('instruction').textContent = "listo! mi único deseo es que me sigas aguantando muchos años más,te quiero ma✨";
          
          setTimeout(() => {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
              confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 } });
              confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 } });
              if (Date.now() < end) requestAnimationFrame(frame);
            }());
          }, 300);
        }
      }
    }
  </script>
</body>
</html>
